name: Deploy site

# Your computer collects the data every morning and pushes data/ (python -m scraper.update).
# That push lands here and republishes the site. GitHub does not scrape on a schedule.
on:
  push:
    branches: [main]
    paths: ["data/**", "site/**", "scraper/sources.json", ".github/workflows/update.yml"]
  workflow_dispatch:           # "Run workflow" button in the Actions tab
    inputs:
      scrape:
        description: "Also run the scraper here (backup for when your computer is off)"
        type: boolean
        default: false
  # To let GitHub scrape daily instead of your computer, uncomment:
  # schedule:
  #   - cron: "17 4 * * *"    # ~06:17 Athens time

permissions:
  contents: write              # commit the refreshed data/
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

# Two jobs, as GitHub recommends for Pages: "build" (optional scrape + package the site) and
# "deploy". If the deploy hits one of GitHub's occasional artifact hiccups, use
# "Re-run failed jobs" and only the deploy runs again, against the package already uploaded.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Scrape sources
        if: github.event_name == 'schedule' || inputs.scrape
        continue-on-error: true    # one bad night shouldn't take the site down
        run: >
          python -m scraper.gov_scraper
          --site-data data
          --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          --contact "https://github.com/${{ github.repository }}/issues"

      # Only commit when the announcements themselves changed. meta.json (last-checked time,
      # source status) is still deployed from the working tree below, just not committed.
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || inputs.scrape
        run: |
          if git diff --quiet -- data/items.json; then
            echo "No new or changed announcements; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update $(TZ=Europe/Athens date +'%Y-%m-%d')"
          # someone may have pushed to main while the scrape ran
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Could not push data after 3 attempts; deploying anyway"

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
