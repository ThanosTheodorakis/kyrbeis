# Start:      docker compose up -d --build
# Logs:       docker compose logs -f
# Run now:    docker compose run --rm kyrbeis once
# Settings:   .env (copy .env.example)
services:
  kyrbeis:
    build: .
    image: kyrbeis
    restart: unless-stopped        # comes back after a reboot or a crash
    env_file: .env
    volumes:
      - repo:/repo                 # the clone of your repository
    logging:
      driver: json-file
      options:
        max-size: "1m"             # keep logs from filling the disk
        max-file: "3"

volumes:
  repo:
